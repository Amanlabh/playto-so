        value: rediss://default:gQAAAAAAASFtAAIgcDI3Njc5MGRmNDExY2Q0ZTEwOTg5NTE1ZjBmMTMzYWJjMQ@popular-collie-74093.upstash.io:6379
      - key: ALLOWED_HOSTS
        value: playto-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://frontend-bjltiixo2-amans-projects-7f59fca9.vercel.app
      - key: DEBUG
        value: "False"

  - type: worker
