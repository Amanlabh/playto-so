services:
  - type: web
    name: playto-web
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/merchants/
    envVars:
      - key: SECRET_KEY
        value: PCXBZ-ffyu3FpaVuo-jCorOwjHcJ9sCR2zcRp0CSntTCoE4qAZcZ0lisKH0EQUVu1pg
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_SbiQB9GldvW1@ep-patient-pine-am65l2wr-pooler.c-5.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
